name: Release to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-main
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run release:check

  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install npm 11
        run: npm install --global npm@11
      - run: npm ci
      - name: Select version and prepare release metadata
        id: release
        run: node scripts/prepare-release.mjs
      - name: Publish the next version
        if: steps.release.outputs.should_publish == 'true'
        # prepublishOnly validates the prepared version before npm uploads anything.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
      # Mirror the same tarball to GitHub Packages so it appears on the repository's /packages page.
      # --ignore-scripts reuses the dist/ output built by prepack/prepublishOnly in the step above.
      - name: Publish the same version to GitHub Packages
        if: steps.release.outputs.should_publish == 'true'
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_PACKAGES_TOKEN" > "$RUNNER_TEMP/github-packages.npmrc"
          npm publish --registry=https://npm.pkg.github.com --userconfig "$RUNNER_TEMP/github-packages.npmrc" --ignore-scripts
      - name: Create GitHub release
        if: steps.release.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >
          gh release create "v${RELEASE_VERSION}"
          --target "${GITHUB_SHA}"
          --title "@yartasdev/pwa@${RELEASE_VERSION}"
          --generate-notes
      - name: Record release result
        if: success()
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SHOULD_PUBLISH: ${{ steps.release.outputs.should_publish }}
        run: >-
          node --input-type=module -e
          "import fs from 'node:fs';
          const result = process.env.SHOULD_PUBLISH === 'true' ? 'Published' : 'Already published; skipped';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
          result + ': @yartasdev/pwa@' + process.env.RELEASE_VERSION + '\nSource commit: ' + process.env.GITHUB_SHA + '\n');"
